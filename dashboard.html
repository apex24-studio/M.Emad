<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | M.EMAD</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Readex+Pro:wght@200;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--bg); color: var(--text); padding: 2rem; min-height: 100vh; }
        .dashboard-container { max-width: 800px; margin: 0 auto; background: rgba(255,255,255,0.05); padding: 2rem; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: white; font-family: inherit; }
        .submit-btn { width: 100%; padding: 1rem; border: none; border-radius: 8px; background: var(--primary); color: white; font-size: 1.1rem; cursor: pointer; transition: 0.3s; font-family: inherit; }
        .submit-btn:hover { background: var(--accent); }
        
        .videos-list { margin-top: 3rem; }
        .video-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.02); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; border: 1px solid rgba(255,255,255,0.05); }
        .video-info { display: flex; align-items: center; gap: 1rem; }
        .video-info img { width: 120px; border-radius: 6px; }
        .delete-btn { background: #ff4757; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }
        
        #login-section { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; }
        #login-form { width: 100%; max-width: 400px; background: rgba(255,255,255,0.05); padding: 2rem; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .logout-btn { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.3); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-section">
        <h2 style="margin-bottom: 2rem;">تسجيل الدخول للوحة التحكم</h2>
        <form id="login-form">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="submit-btn">تسجيل الدخول</button>
            <p id="login-error" style="color: #ff4757; margin-top: 1rem; display: none;"></p>
        </form>
    </div>

    <div id="dashboard-section" class="dashboard-container" style="display: none;">
        <div class="header-top">
            <h2>إضافة فيديو جديد</h2>
            <div>
                <a href="index.html" class="logout-btn" style="text-decoration: none; margin-left: 10px;">العودة للموقع</a>
                <button id="logout-btn" class="logout-btn">تسجيل الخروج</button>
            </div>
        </div>
        
        <form id="add-video-form">
            <div class="form-group">
                <label>رابط يوتيوب (مثال: https://www.youtube.com/watch?v=...)</label>
                <input type="url" id="youtube-link" required>
            </div>
            <div class="form-group">
                <label>اسم المشروع / الفيديو</label>
                <input type="text" id="project-title" required>
            </div>
            <div class="form-group">
                <label>التصنيف</label>
                <select id="project-category" required>
                    <option value="restaurants">مطاعم</option>
                    <option value="clinics">عيادات طبية</option>
                    <option value="cafes">كافيهات</option>
                    <option value="other">أخرى</option>
                </select>
            </div>
            <button type="submit" class="submit-btn">إضافة للفيديو</button>
        </form>

        <div class="videos-list">
            <h3>الفيديوهات المرفوعة</h3>
            <div id="videos-container">
                <!-- سيتم عرض الفيديوهات هنا -->
            </div>
        </div>
    </div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
